services:
  bogie-inspector:
    image: bogie-inspector
    environment:
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - .:/app
      - ./dataset:/app/dataset
      - ./parameters:/app/parameters
      - ./anomaly_results:/app/anomaly_results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]